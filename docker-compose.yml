services:
  sp2:
    image: localhost/hermes-music_hermes-music:latest
    container_name: sp2
    ports:
      - "18812:8642"
      - "18813:8644"
    volumes:
      - ./data:/opt/data
      - /mnt/d/music:/opt/data/music
    env_file:
      - ./.env
    entrypoint: ["/opt/data/scripts/entrypoint-wrapper.sh"]

  dawagent:
    image: localhost/hermes-music_dawagent:latest
    container_name: dawagent-sp2
    volumes:
      - ./data/dawagent/sessions:/opt/dawagent/sessions
      - ./data/dawagent/exports:/opt/dawagent/exports
      - /mnt/d/music:/opt/dawagent/imports:ro
    environment:
      - JACK_NO_AUDIO_RESERVATION=1
      - DISPLAY=:99
